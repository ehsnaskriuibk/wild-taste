<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wild Taste</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#0a0a0a; --surface:#141414; --surface2:#1e1e1e;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.15);
  --text:#f0ede8; --muted:rgba(240,237,232,0.52); --hint:rgba(240,237,232,0.28);
  --accent:#c8b89a; --accent-dim:rgba(200,184,154,0.12);
  --danger:rgba(220,80,80,0.85);
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --ease:cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}

/* ════════════════════════════════
   VIEWS  (homepage / slideshow)
════════════════════════════════ */
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 0.5s var(--ease)}
.view.active{opacity:1;pointer-events:all}

/* ════════════════════════════════
   HOMEPAGE
════════════════════════════════ */
#homepage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:var(--bg)}

.home-title{font-family:var(--serif);font-size:clamp(4rem,9vw,7rem);font-weight:400;line-height:1.0;letter-spacing:-0.01em;color:var(--text);opacity:0;transform:translateY(16px);animation:fadeUp 0.8s var(--ease) 0.1s forwards}
.home-title em{font-style:italic;color:var(--accent)}

.home-sub{font-size:clamp(1rem,2vw,1.2rem);color:var(--muted);margin-top:1.5rem;max-width:460px;line-height:1.7;opacity:0;transform:translateY(12px);animation:fadeUp 0.7s var(--ease) 0.3s forwards}

.home-btns{display:flex;gap:12px;margin-top:3rem;opacity:0;transform:translateY(10px);animation:fadeUp 0.6s var(--ease) 0.5s forwards}

.btn-primary{display:flex;align-items:center;gap:10px;background:var(--accent);color:#1a1510;border:none;border-radius:10px;padding:15px 38px;font-family:var(--sans);font-size:16px;font-weight:500;cursor:pointer;transition:opacity 0.2s,transform 0.15s}
.btn-primary:hover{opacity:0.88;transform:translateY(-1px)}
.btn-primary:active{transform:scale(0.97)}
.btn-primary svg{width:17px;height:17px}

.btn-ghost{display:flex;align-items:center;gap:10px;background:transparent;color:var(--muted);border:0.5px solid var(--border2);border-radius:10px;padding:15px 28px;font-family:var(--sans);font-size:16px;font-weight:400;cursor:pointer;transition:background 0.2s,color 0.2s,border-color 0.2s}
.btn-ghost:hover{background:var(--surface);color:var(--text);border-color:rgba(255,255,255,0.25)}
.btn-ghost svg{width:17px;height:17px}

/* ════════════════════════════════
   SETTINGS DIALOG
════════════════════════════════ */
#settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s var(--ease)}
#settings-overlay.open{opacity:1;pointer-events:all}

#settings-dialog{background:var(--surface);border:0.5px solid var(--border2);border-radius:16px;width:min(640px,94vw);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(16px);transition:transform 0.3s var(--ease)}
#settings-overlay.open #settings-dialog{transform:translateY(0)}

.dlg-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:0.5px solid var(--border)}
.dlg-header h2{font-size:17px;font-weight:500;color:var(--text)}
.dlg-close{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center;transition:color 0.15s}
.dlg-close:hover{color:var(--text)}
.dlg-close svg{width:18px;height:18px}

.dlg-body{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.dlg-body::-webkit-scrollbar{width:3px}
.dlg-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.dlg-section-label{font-size:11px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--hint);margin-bottom:10px}

/* default images list */
.default-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.default-thumb{position:relative;aspect-ratio:4/3;border-radius:7px;overflow:hidden;border:0.5px solid var(--border);cursor:pointer}
.default-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.default-thumb .thumb-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s}
.default-thumb:hover .thumb-overlay{opacity:1}
.default-thumb .thumb-label{position:absolute;bottom:0;left:0;right:0;font-size:9px;padding:4px 5px;background:rgba(0,0,0,0.7);color:rgba(255,255,255,0.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.default-thumb.excluded{opacity:0.3}
.default-thumb.excluded .thumb-overlay{opacity:1;background:rgba(0,0,0,0.6)}
.exclude-icon{color:#fff;font-size:18px;line-height:1}

/* custom images */
.custom-list{display:flex;flex-direction:column;gap:8px}
.custom-row{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;background:var(--surface2);border-radius:8px;padding:8px 10px;border:0.5px solid var(--border)}
.custom-thumb-wrap{width:56px;height:42px;border-radius:5px;overflow:hidden;background:var(--bg);border:0.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:11px;position:relative}
.custom-thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.custom-thumb-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.custom-inputs{display:flex;flex-direction:column;gap:5px}
.custom-inputs input{background:var(--bg);border:0.5px solid var(--border2);border-radius:6px;padding:6px 10px;font-family:var(--sans);font-size:13px;color:var(--text);width:100%;outline:none}
.custom-inputs input::placeholder{color:var(--hint)}
.custom-inputs input:focus{border-color:rgba(200,184,154,0.4)}
.custom-inputs input.warn{border-color:rgba(220,140,80,0.5)}
.row-remove{background:none;border:none;color:var(--hint);cursor:pointer;padding:4px;border-radius:5px;display:flex;align-items:center;transition:color 0.15s}
.row-remove:hover{color:var(--danger)}
.row-remove svg{width:16px;height:16px}

.add-custom-btn{display:flex;align-items:center;gap:8px;background:none;border:0.5px dashed var(--border2);border-radius:8px;padding:10px 14px;font-family:var(--sans);font-size:13px;color:var(--muted);cursor:pointer;width:100%;transition:background 0.15s,color 0.15s}
.add-custom-btn:hover{background:var(--surface2);color:var(--text)}
.add-custom-btn svg{width:15px;height:15px}

.dlg-footer{padding:16px 24px;border-top:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.dlg-footer-note{font-size:13px;color:var(--hint)}
.dlg-save{background:var(--accent);color:#1a1510;border:none;border-radius:8px;padding:10px 24px;font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;transition:opacity 0.2s}
.dlg-save:hover{opacity:0.88}

/* ════════════════════════════════
   SLIDESHOW VIEW
════════════════════════════════ */
#slideshow{background:#000}

/* slide system inside */
#deck{position:absolute;inset:0}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 0.55s var(--ease);display:flex;flex-direction:column;align-items:center;justify-content:center}
.slide.active{opacity:1;pointer-events:all}

/* text slides */
.text-slide{background:var(--bg);padding:3rem 2rem;text-align:left;justify-content:center;align-items:flex-start;max-width:900px;margin:0 auto;width:100%}

.slide-label{font-size:13px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);margin-bottom:2rem;opacity:0;transform:translateY(10px)}
.slide.active .slide-label{animation:fadeUp 0.5s var(--ease) 0.1s forwards}

.slide-title{font-family:var(--serif);font-size:clamp(3.5rem,7vw,5.5rem);font-weight:400;line-height:1.05;color:var(--text);letter-spacing:-0.01em;margin-bottom:0;opacity:0;transform:translateY(14px)}
.slide.active .slide-title{animation:fadeUp 0.75s var(--ease) 0.2s forwards}
.slide-title em{font-style:italic;color:var(--accent)}

.slide-divider-h{width:48px;height:1px;background:var(--accent);margin:2rem 0;opacity:0}
.slide.active .slide-divider-h{animation:fadeIn 0.6s var(--ease) 0.45s forwards}

.slide-instruction{font-size:clamp(1.1rem,2vw,1.35rem);color:var(--muted);line-height:2.1;max-width:560px;opacity:0;transform:translateY(10px)}
.slide.active .slide-instruction{animation:fadeUp 0.6s var(--ease) 0.55s forwards}
.slide-instruction .step{display:flex;align-items:baseline;gap:1rem;padding:0.1rem 0}
.slide-instruction .step-num{font-size:11px;font-weight:500;letter-spacing:0.1em;color:var(--accent);min-width:18px;flex-shrink:0}
.slide-instruction .step-text{color:var(--muted)}
.slide-instruction .step-text strong{color:var(--text);font-weight:500}

.slide-body{font-size:clamp(1.15rem,2.2vw,1.5rem);color:var(--muted);line-height:1.75;max-width:600px;opacity:0;transform:translateY(10px)}
.slide.active .slide-body{animation:fadeUp 0.65s var(--ease) 0.55s forwards}

.slide-divider{width:1px;height:56px;background:linear-gradient(to bottom,transparent,var(--accent),transparent);margin-bottom:2rem;opacity:0}
.slide.active .slide-divider{animation:fadeIn 0.8s var(--ease) 0.1s forwards}

/* end game button on ending slide */
.end-btns{display:flex;gap:12px;margin-top:2.5rem;opacity:0;transform:translateY(10px)}
.slide.active .end-btns{animation:fadeUp 0.55s var(--ease) 0.55s forwards}
.end-btn{display:flex;align-items:center;gap:9px;border-radius:10px;padding:13px 28px;font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer;transition:background 0.2s,border-color 0.2s,opacity 0.2s}
.end-btn.ghost{background:transparent;color:var(--accent);border:0.5px solid rgba(200,184,154,0.35)}
.end-btn.ghost:hover{background:var(--accent-dim);border-color:var(--accent)}
.end-btn.solid{background:var(--accent);color:#1a1510;border:none}
.end-btn.solid:hover{opacity:0.88}
.end-btn svg{width:16px;height:16px}

/* image slides */
.img-slide{background:#000}
.img-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.img-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.18) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,0.58) 100%);pointer-events:none}
.img-num{position:absolute;top:22px;left:26px;font-size:13px;font-weight:500;letter-spacing:0.12em;padding:7px 16px;border-radius:999px;z-index:5}
.img-num.p1{background:rgba(200,184,154,0.16);color:var(--accent);border:0.5px solid rgba(200,184,154,0.28)}
.img-num.p2{background:rgba(120,200,140,0.13);color:#8ecf9a;border:0.5px solid rgba(120,200,140,0.28)}
.img-location{position:absolute;bottom:80px;left:32px;z-index:5;opacity:0;transform:translateY(10px);transition:opacity 0.5s var(--ease) 0.1s,transform 0.5s var(--ease) 0.1s}
.img-location.visible{opacity:1;transform:translateY(0)}
.loc-country{font-size:12px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.loc-name{font-family:var(--serif);font-size:clamp(2rem,4.5vw,3.2rem);color:#fff;line-height:1.1;text-shadow:0 2px 28px rgba(0,0,0,0.6)}

/* ── CONTROLS OVERLAY ── */
#controls{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:0 0 28px;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transition:opacity 0.3s var(--ease);pointer-events:none}
#controls.visible{opacity:1;pointer-events:all}

.progress-dots{display:flex;gap:5px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.22);transition:background 0.25s,transform 0.25s;flex-shrink:0}
.dot.active{background:var(--accent);transform:scale(1.35)}
.dot.gap{margin-left:10px}

.ctrl-bar{display:flex;align-items:center;gap:8px;background:rgba(10,10,10,0.85);border:0.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:8px 10px}
.ctrl-btn{display:flex;align-items:center;justify-content:center;gap:7px;background:transparent;border:none;border-radius:8px;color:rgba(255,255,255,0.7);cursor:pointer;padding:8px 14px;font-family:var(--sans);font-size:14px;font-weight:400;transition:background 0.15s,color 0.15s;white-space:nowrap}
.ctrl-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
.ctrl-btn:disabled{opacity:0.25;cursor:not-allowed}
.ctrl-btn:active:not(:disabled){transform:scale(0.96)}
.ctrl-btn svg{width:17px;height:17px;flex-shrink:0}
.ctrl-btn.primary{background:var(--accent);color:#1a1510;font-weight:500;padding:8px 20px}
.ctrl-btn.primary:hover{opacity:0.88;background:var(--accent)}
.ctrl-divider{width:0.5px;height:22px;background:rgba(255,255,255,0.12);margin:0 2px}
.ctrl-counter{font-size:13px;color:rgba(255,255,255,0.4);font-weight:300;letter-spacing:0.06em;padding:0 6px;min-width:44px;text-align:center}

#hover-zone{position:fixed;bottom:0;left:0;right:0;height:120px;z-index:99;pointer-events:all}
body.hide-cursor,body.hide-cursor *{cursor:none!important}

@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<!-- ═══════════════════ HOMEPAGE ═══════════════════ -->
<div id="homepage" class="view active">
  <h1 class="home-title">Wild <em>Taste</em></h1>
  <p class="home-sub">Rate landscapes in silence, then reveal the locations — see how your taste in nature compares with your friends.</p>
  <div class="home-btns">
    <button class="btn-primary" id="btnStart">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5l9 5.5-9 5.5V2.5z"/></svg>
      Start
    </button>
    <button class="btn-ghost" id="btnSettings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.42 1.42M11.53 11.53l1.42 1.42M11.53 4.47l1.42-1.42M3.05 12.95l1.42-1.42"/></svg>
      Settings
    </button>
  </div>
</div>

<!-- ═══════════════════ SETTINGS DIALOG ═══════════════════ -->
<div id="settings-overlay">
  <div id="settings-dialog">
    <div class="dlg-header">
      <h2>Settings</h2>
      <button class="dlg-close" id="btnCloseSettings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div class="dlg-body" id="dlgBody">

      <div>
        <div class="dlg-section-label">Default images — click to exclude</div>
        <div class="default-grid" id="defaultGrid"></div>
      </div>

      <div>
        <div class="dlg-section-label">Your own images</div>
        <div class="custom-list" id="customList"></div>
        <button class="add-custom-btn" id="addCustomBtn">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
          Add image
        </button>
      </div>

    </div>
    <div class="dlg-footer">
      <span class="dlg-footer-note" id="dlgNote">10 images selected</span>
      <button class="dlg-save" id="btnSaveSettings">Save & close</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ SLIDESHOW ═══════════════════ -->
<div id="slideshow" class="view">
  <div id="deck"></div>
  <div id="hover-zone"></div>
  <div id="controls">
    <div class="progress-dots" id="progressDots"></div>
    <div class="ctrl-bar">
      <button class="ctrl-btn" id="btnRestart" title="Restart slideshow">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8A5.5 5.5 0 112.5 5m0 0V2m0 3h3"/></svg>
      </button>
      <div class="ctrl-divider"></div>
      <button class="ctrl-btn" id="btnPrev" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
        Prev
      </button>
      <span class="ctrl-counter" id="ctrlCounter">1 / 25</span>
      <button class="ctrl-btn primary" id="btnNext">
        Next
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3l5 5-5 5"/></svg>
      </button>
      <div class="ctrl-divider"></div>
      <button class="ctrl-btn" id="btnFs" title="Fullscreen">
        <svg id="fsIcon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3"/>
        </svg>
      </button>
      <div class="ctrl-divider"></div>
      <button class="ctrl-btn" id="btnExit" title="Exit to home">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2H2v12h4M10 11l4-3-4-3M14 8H6"/></svg>
        Exit
      </button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   DEFAULT IMAGES
═══════════════════════════════════════════ */
const DEFAULT_IMAGES = [
  {url:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1600&q=85",location:"Lofoten Islands",country:"Norway"},
  {url:"https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1600&q=85",location:"Sahara Desert",country:"Morocco"},
  {url:"https://images.unsplash.com/photo-1501854140801-50d01698950b?w=1600&q=85",location:"Patagonia",country:"Argentina"},
  {url:"https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=1600&q=85",location:"Black Forest",country:"Germany"},
  {url:"https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1600&q=85",location:"Great Plains",country:"United States"},
  {url:"https://images.unsplash.com/photo-1510797215324-95aa89f43c33?w=1600&q=85",location:"Scottish Highlands",country:"Scotland"},
  {url:"https://images.unsplash.com/photo-1504701954957-2010ec3bcec1?w=1600&q=85",location:"Ha Long Bay",country:"Vietnam"},
  {url:"https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?w=1600&q=85",location:"Namib Desert",country:"Namibia"},
  {url:"https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=85",location:"Pacific Northwest",country:"United States"},
  {url:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1600&q=85",location:"Swiss Alps",country:"Switzerland"},
];

/* ═══════════════════════════════════════════
   PERSISTENCE
═══════════════════════════════════════════ */
const STORE_KEY = 'wildtaste_settings';

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { mode:'default', excluded:[], custom:[] };
}

function saveSettings(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
}

let settings = loadSettings();

/* ═══════════════════════════════════════════
   VIEW SWITCHING
═══════════════════════════════════════════ */
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ═══════════════════════════════════════════
   SETTINGS DIALOG
═══════════════════════════════════════════ */
const overlay = document.getElementById('settings-overlay');

function openSettings() { overlay.classList.add('open'); renderSettings(); }
function closeSettings() { overlay.classList.remove('open'); }

document.getElementById('btnSettings').addEventListener('click', openSettings);
document.getElementById('btnCloseSettings').addEventListener('click', closeSettings);
document.getElementById('btnSaveSettings').addEventListener('click', () => {
  saveSettings(settings);
  closeSettings();
});

overlay.addEventListener('click', e => { if (e.target === overlay) closeSettings(); });

function renderSettings() {
  renderDefaultGrid();
  renderCustomList();
  updateNote();
}

/* default grid */
function renderDefaultGrid() {
  const grid = document.getElementById('defaultGrid');
  grid.innerHTML = '';
  DEFAULT_IMAGES.forEach((img, i) => {
    const excluded = settings.excluded.includes(i);
    const cell = document.createElement('div');
    cell.className = 'default-thumb' + (excluded ? ' excluded' : '');
    cell.innerHTML = `
      <img src="${img.url.replace('w=1600','w=200')}" alt="${img.location}" loading="lazy" />
      <div class="thumb-overlay"><span class="exclude-icon">${excluded ? '+' : '×'}</span></div>
      <div class="thumb-label">${img.location}</div>
    `;
    cell.addEventListener('click', () => {
      if (excluded) {
        settings.excluded = settings.excluded.filter(x => x !== i);
      } else {
        settings.excluded.push(i);
      }
      renderDefaultGrid();
      updateNote();
    });
    grid.appendChild(cell);
  });
}

/* custom list */
function renderCustomList() {
  const list = document.getElementById('customList');
  list.innerHTML = '';
  (settings.custom || []).forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'custom-row';

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'custom-thumb-wrap';

    if (item.dataUrl) {
      const img = document.createElement('img');
      img.src = item.dataUrl;
      thumbWrap.appendChild(img);
    } else {
      thumbWrap.textContent = 'Add';
    }

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        settings.custom[i].dataUrl = ev.target.result;
        renderCustomList();
        updateNote();
      };
      reader.readAsDataURL(file);
    });
    thumbWrap.appendChild(fileInput);

    const inputs = document.createElement('div');
    inputs.className = 'custom-inputs';

    const locInput = document.createElement('input');
    locInput.type = 'text';
    locInput.placeholder = 'Location (e.g. Faroe Islands)';
    locInput.value = item.location || '';
    if (!item.location && item.dataUrl) locInput.classList.add('warn');
    locInput.addEventListener('input', () => {
      settings.custom[i].location = locInput.value;
      locInput.classList.toggle('warn', !locInput.value && !!item.dataUrl);
      updateNote();
    });

    const countryInput = document.createElement('input');
    countryInput.type = 'text';
    countryInput.placeholder = 'Country (e.g. Denmark)';
    countryInput.value = item.country || '';
    countryInput.addEventListener('input', () => {
      settings.custom[i].country = countryInput.value;
    });

    inputs.appendChild(locInput);
    inputs.appendChild(countryInput);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'row-remove';
    removeBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l10 10M13 3L3 13"/></svg>';
    removeBtn.addEventListener('click', () => {
      settings.custom.splice(i, 1);
      renderCustomList();
      updateNote();
    });

    row.appendChild(thumbWrap);
    row.appendChild(inputs);
    row.appendChild(removeBtn);
    list.appendChild(row);
  });
}

document.getElementById('addCustomBtn').addEventListener('click', () => {
  if (!settings.custom) settings.custom = [];
  settings.custom.push({ dataUrl:'', location:'', country:'' });
  renderCustomList();
  updateNote();
});

function updateNote() {
  const count = getActiveImages().length;
  document.getElementById('dlgNote').textContent = count === 1 ? '1 image selected' : `${count} images selected`;
}

function getActiveImages() {
  const list = [];
  DEFAULT_IMAGES.forEach((img, i) => {
    if (!settings.excluded.includes(i)) list.push(img);
  });
  (settings.custom || []).forEach(item => {
    if (item.dataUrl) list.push({ url: item.dataUrl, location: item.location || '?', country: item.country || '' });
  });
  return list;
}

/* ═══════════════════════════════════════════
   SLIDESHOW BUILD
═══════════════════════════════════════════ */
const deck = document.getElementById('deck');
let slides = [];
let current = 0;
const SECTION_STARTS_BASE = [0]; // intro always 0

function clearDeck() {
  deck.innerHTML = '';
  slides = [];
}

function makeTextSlide(id, html) {
  const div = document.createElement('div');
  if (id) div.id = id;
  div.className = 'slide text-slide';
  div.innerHTML = html;
  deck.appendChild(div);
  slides.push(div);
}

function makeImgSlide(img, phase, index) {
  const div = document.createElement('div');
  div.className = 'slide img-slide';
  div.innerHTML = `
    <div class="img-bg" style="background-image:url('${img.url}')"></div>
    <div class="img-overlay"></div>
    <div class="img-num ${phase===1?'p1':'p2'}">${index+1}</div>
    <div class="img-location${phase===2?' visible':''}">
      <div class="loc-country">${img.country||''}</div>
      <div class="loc-name">${img.location||'?'}</div>
    </div>
  `;
  deck.appendChild(div);
  slides.push(div);
}

function buildDeck() {
  clearDeck();
  const images = getActiveImages();

  // 1. intro
  makeTextSlide('s-intro', `
    <p class="slide-label">Round 1 of 2</p>
    <h1 class="slide-title">Rate each<br>landscape</h1>
    <div class="slide-divider-h"></div>
    <div class="slide-instruction">
      <div class="step"><span class="step-num">A</span><span class="step-text">Beauty &nbsp;<strong>1 – 10</strong></span></div>
      <div class="step"><span class="step-num">B</span><span class="step-text">Desire to visit &nbsp;<strong>1 – 10</strong></span></div>
      <div class="step"><span class="step-num">C</span><span class="step-text">Guess the location</span></div>
      <div class="step"><span class="step-num">D</span><span class="step-text">One word description</span></div>
    </div>
  `);

  // 2. phase 1
  images.forEach((img, i) => makeImgSlide(img, 1, i));

  // 3. transition
  const transIdx = slides.length;
  makeTextSlide('s-transition', `
    <p class="slide-label">Round 2 of 2</p>
    <h2 class="slide-title">Same images<br><em>Locations revealed</em></h2>
    <div class="slide-divider-h"></div>
    <p class="slide-body">Share and discuss your ratings, guesses and descriptions out loud</p>
  `);

  // 4. phase 2
  const p2Idx = slides.length;
  images.forEach((img, i) => makeImgSlide(img, 2, i));

  // 5. ending
  makeTextSlide('s-ending', `
    <h2 class="slide-title" style="font-size:clamp(2.4rem,5.5vw,4.5rem)">Wild <em>Taste</em></h2>
    <div class="end-btns">
      <button class="end-btn ghost" id="endRestartBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8A5.5 5.5 0 112.5 5m0 0V2m0 3h3"/></svg>
        Play again
      </button>
      <button class="end-btn solid" id="endHomeBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2H2v12h4M10 11l4-3-4-3M14 8H6"/></svg>
        Exit
      </button>
    </div>
  `);

  // progress dots
  const dotsEl = document.getElementById('progressDots');
  dotsEl.innerHTML = '';
  const sectionStarts = [0, 1, transIdx, p2Idx, slides.length - 1];
  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (sectionStarts.includes(i) && i > 0 ? ' gap' : '');
    dotsEl.appendChild(dot);
  });

  // preload
  images.forEach(img => { if (!img.url.startsWith('data:')) { const im = new Image(); im.src = img.url; }});

  document.getElementById('endRestartBtn').addEventListener('click', () => goTo(0));
  document.getElementById('endHomeBtn').addEventListener('click', goHome);
}

function goHome() {
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  showView('homepage');
}

function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  slides[current].classList.remove('active');
  current = idx;
  slides[current].classList.add('active');
  updateControls();
}

function updateControls() {
  document.getElementById('btnPrev').disabled = current === 0;
  const nb = document.getElementById('btnNext');
  const isLast = current === slides.length - 1;
  nb.disabled = isLast;
  nb.innerHTML = isLast
    ? 'Done'
    : 'Next <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3l5 5-5 5"/></svg>';
  document.getElementById('ctrlCounter').textContent = (current+1) + ' / ' + slides.length;
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i === current));
}

/* ═══════════════════════════════════════════
   START GAME
═══════════════════════════════════════════ */
function startGame() {
  buildDeck();
  current = 0;
  showView('slideshow');
  goTo(0);
  document.documentElement.requestFullscreen().catch(()=>{});
}

document.getElementById('btnStart').addEventListener('click', startGame);

/* ═══════════════════════════════════════════
   SLIDE CONTROLS
═══════════════════════════════════════════ */
document.getElementById('btnNext').addEventListener('click', () => goTo(current+1));
document.getElementById('btnPrev').addEventListener('click', () => goTo(current-1));
document.getElementById('btnRestart').addEventListener('click', () => goTo(0));
document.getElementById('btnExit').addEventListener('click', goHome);

document.addEventListener('keydown', e => {
  if (!document.getElementById('slideshow').classList.contains('active')) return;
  if (e.key==='ArrowRight'||e.key===' '){e.preventDefault();goTo(current+1)}
  if (e.key==='ArrowLeft'){e.preventDefault();goTo(current-1)}
  if (e.key==='f'||e.key==='F') toggleFs();
  if (e.key==='Escape'&&!document.fullscreenElement) goHome();
});

/* ═══════════════════════════════════════════
   FULLSCREEN
═══════════════════════════════════════════ */
function toggleFs() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}

document.getElementById('btnFs').addEventListener('click', toggleFs);

document.addEventListener('fullscreenchange', () => {
  const isFs = !!document.fullscreenElement;
  document.getElementById('fsIcon').innerHTML = isFs
    ? '<path d="M5 2v3H2M11 2v3h3M11 14v-3h3M5 14v-3H2"/>'
    : '<path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3"/>';
  if (!isFs) { document.body.classList.remove('hide-cursor'); clearTimeout(hideTimer); }
});

/* ═══════════════════════════════════════════
   CONTROLS SHOW/HIDE
═══════════════════════════════════════════ */
const controls = document.getElementById('controls');
const hoverZone = document.getElementById('hover-zone');
let hideTimer = null;

function showControls() {
  controls.classList.add('visible');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideControls, 2200);
  document.body.classList.remove('hide-cursor');
}

function hideControls() {
  controls.classList.remove('visible');
  if (document.fullscreenElement) document.body.classList.add('hide-cursor');
}

hoverZone.addEventListener('mouseenter', showControls);
hoverZone.addEventListener('mousemove', showControls);
controls.addEventListener('mouseenter', () => { clearTimeout(hideTimer); controls.classList.add('visible'); document.body.classList.remove('hide-cursor'); });
controls.addEventListener('mouseleave', () => { hideTimer = setTimeout(hideControls, 1000); });
</script>
